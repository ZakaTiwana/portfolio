<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  
  <!-- Viewport meta tag for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio_flutter_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Muhammad Zakaullah Portfolio</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0A0E1A 0%, #0D1520 50%, #0F1A2E 100%);
      min-height: 100vh;
      min-height: 100dvh; /* Dynamic viewport height for mobile */
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile */
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    /* Prevent white flash and ensure full height */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile */
      background: linear-gradient(135deg, #0A0E1A 0%, #0D1520 50%, #0F1A2E 100%);
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    /* Mobile-specific fixes */
    @media screen and (max-width: 768px) {
      html, body {
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
      }
      
      /* Prevent white space at bottom on mobile */
      body {
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
      }
    }
    
    .loading-text {
      color: #00BFFF;
      font-family: 'Arial', sans-serif;
      font-size: 18px;
      font-weight: 500;
      margin-left: 20px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 191, 255, 0.3);
      border-top: 3px solid #00BFFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Hide loading when Flutter is ready */
    .loaded #loading {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Portfolio...</div>
  </div>
  
  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('loaded');
    });
    
    // Fallback: hide loading after 5 seconds
    setTimeout(function() {
      document.body.classList.add('loaded');
    }, 5000);
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
